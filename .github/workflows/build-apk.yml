name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Accept licenses and ensure platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          echo "using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install npm dependencies
        run: npm ci

      # runner 每次临时生成 ~/.android/debug.keystore，签名各不相同 → 手机上无法覆盖
      # 安装，必须先卸载（会丢数据）。这里用仓库里固定的自签 debug key 覆盖它。
      # 这是 debug 用途的自签证书，不用于正式发布。
      - name: Use fixed debug keystore
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -importkeystore \
            -srckeystore android/app/yi-debug.p12 -srcstoretype PKCS12 -srcstorepass android \
            -destkeystore "$HOME/.android/debug.keystore" -deststoretype JKS \
            -deststorepass android -destkeypass android \
            -alias androiddebugkey -noprompt
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | head -4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/life-control-${{ github.run_number }}.apk"
          ls -lh out

      # 包里那份网页必须和仓库里的 www/index.html 完全一致，否则直接失败，
      # 避免"构建成功但装上去还是旧页面"这种最难查的问题。
      - name: Verify packaged web matches www
        run: |
          APK="out/life-control-${{ github.run_number }}.apk"
          IN_APK=$(unzip -p "$APK" assets/public/index.html | sha256sum | cut -d' ' -f1)
          IN_REPO=$(sha256sum www/index.html | cut -d' ' -f1)
          echo "packaged=$IN_APK"
          echo "repo    =$IN_REPO"
          test "$IN_APK" = "$IN_REPO"

      # 签名必须是仓库里那把固定 key，否则用户又得卸载重装才能升级。
      - name: Verify APK signing key
        run: |
          APK="out/life-control-${{ github.run_number }}.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          fi
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i "SHA-256 digest" | head -1 | tr -d ' :' | tr 'A-F' 'a-f')
          echo "signer: $DIGEST"
          echo "$DIGEST" | grep -q "a7145c457573ff9f" \
            || { echo "ERROR: APK 不是固定 debug key 签名"; exit 1; }
          echo "固定签名校验通过"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: life-control-apk
          path: out/*.apk
          retention-days: 30

      # 再发一份到 Releases：artifacts 下载要登录，Release 的直链谁都能拿，
      # 拿不到写权限时（fork/PR）就跳过，不拖垮构建。
      - name: Publish APK to Release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" "out/life-control-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "意 · APK #${{ github.run_number }}" \
            --notes "由 ${{ github.sha }} 构建。包内 assets/public/index.html 已校验与 www/index.html 一致。" \
            || gh release upload "$TAG" "out/life-control-${{ github.run_number }}.apk" --clobber --repo "${{ github.repository }}"
